<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf4ee">
  <meta name="description" content="ピンときた写真を手がかりに、一日を前向きな物語にしてふりかえる内省アプリ">
  <title>写真で一日をふりかえる</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-scene="intro">
  <!-- 背景でゆっくり漂うパステルの色だまり（場面ごとに色が変わる） -->
  <div class="backdrop" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <header class="topbar">
    <h1 id="brand"></h1>
    <ol class="progress" id="progress" aria-label="進み具合"></ol>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="foot">
    写真は Lorem Picsum から取得しています（元の写真は Unsplash のもので、撮影者名を表示しています）。
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
